name: Deploy to home server

# This repo holds SQL scripts, notebooks and datasets -- there is no service to
# build or restart. "Deploy" here means keeping the server-side working copy at
# ~/apps/portfolioprojects in sync with main so the queries and data are
# available on the box.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Reach the server through the Cloudflare tunnel
        run: |
          curl -fsSL -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb > /dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf 'Host *\n  ProxyCommand cloudflared access ssh --hostname %%h\n  ServerAliveInterval 30\n' >> ~/.ssh/config

      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync working copy on server
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          cat > /tmp/deploy.sh <<'DEPLOY_SCRIPT'
          set -e
          cd /home/admin/apps/portfolioprojects

          echo '--- Pulling latest ---'
          git fetch origin
          git reset --hard origin/main
          git clean -fd

          echo "--- Synced to $(git rev-parse --short HEAD) ---"
          DEPLOY_SCRIPT
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" 'f=$(mktemp) && cat > "$f" && bash "$f" < /dev/null; rc=$?; rm -f "$f"; exit $rc' < /tmp/deploy.sh
